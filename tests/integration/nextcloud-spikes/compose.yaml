# Isolierte Testumgebung für Nextcloud-API-Spikes (Photo Organizer, Auftrag 5).
# Projektname, Images und Passwörter kommen ausschließlich aus versions/ncXX.env
# und .state/<projekt>/secrets.env (vom CLI `ncspike` erzeugt). Nicht direkt aufrufen.
#
# Isolation:
#   - Netzwerk `spike` ist `internal: true` (kein Zugang nach außen, kein Zugang von außen)
#   - keine veröffentlichten Ports; Zugriff nur via `docker compose exec`
#   - kein Docker-Socket, keine privilegierten Container, keine Host-Mounts außer der
#     schreibgeschützten Probe-App aus diesem Verzeichnis
#   - alle Ressourcen tragen den Projektpräfix und das Label po-spike=1
name: ${PO_SPIKE_PROJECT:?use ncspike}

x-common: &common
  restart: "no"
  security_opt: ["no-new-privileges:true"]
  privileged: false
  labels:
    po-spike: "1"
    po-spike.nc: "${PO_SPIKE_NC}"
  networks: [spike]

services:
  db:
    <<: *common
    image: ${DB_IMAGE}
    command: ["--transaction-isolation=READ-COMMITTED", "--log-bin=binlog", "--binlog-format=ROW", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:?}
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: ${DB_PASS:?}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 1g

  redis:
    <<: *common
    image: ${REDIS_IMAGE}
    command: ["redis-server", "--requirepass", "${REDIS_PASS:?}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASS\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASS: ${REDIS_PASS:?}
    mem_limit: 256m

  app:
    <<: *common
    image: ${NC_IMAGE}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${DB_PASS:?}
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASS:?}
      NEXTCLOUD_ADMIN_USER: spikeadmin
      NEXTCLOUD_ADMIN_PASSWORD: ${ADMIN_PASS:?}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
      PHP_MEMORY_LIMIT: 1G
      PO_SPIKE_PASS_ALICE: ${ALICE_PASS:?}
      PO_SPIKE_PASS_BOB: ${BOB_PASS:?}
      PO_SPIKE_PROJECT: ${PO_SPIKE_PROJECT}
    volumes:
      - nextcloud:/var/www/html
      - ./probe/po_spike_probe:/var/www/html/custom_apps/po_spike_probe:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/status.php || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 20s
    mem_limit: 2g

  cron:
    <<: *common
    image: ${NC_IMAGE}
    entrypoint: /cron.sh
    depends_on:
      app: {condition: service_healthy}
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${DB_PASS:?}
    volumes:
      - nextcloud:/var/www/html
      - ./probe/po_spike_probe:/var/www/html/custom_apps/po_spike_probe:ro
    profiles: ["cron"]
    mem_limit: 1g

networks:
  spike:
    internal: true
    labels:
      po-spike: "1"

volumes:
  db:
    labels: {po-spike: "1"}
  nextcloud:
    labels: {po-spike: "1"}
